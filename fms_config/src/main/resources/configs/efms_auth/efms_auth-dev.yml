spring:
  application:
    name: fms_auth
  cloud:
    discovery:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/efms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    driverClassName: "com.mysql.cj.jdbc.Driver"
    jpa:
      hibernate:
        ddl-auto: none # Disables automatic schema creation or updates
      show-sql: true # Logs SQL queries to the console for debugging
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect # Use MySQL 8 dialect
      open-in-view: false # Disable Open Session in View to avoid potential performance issues

server:
  port: 8085
  servlet:
    context-path: /fms-auth-service

logging:
  level:
    org.springframework.jdbc: DEBUG
    org.hibernate: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
